<!DOCTYPE html>
<html>
<head>
<title>Patient Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1e293b;
  padding:30px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Patient Login</h2>

<input id="pid" placeholder="Patient ID">
<input id="name" placeholder="Name">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
function login(){
  localStorage.setItem("patientId", document.getElementById("pid").value);
  window.location.href="patient-dashboard.html";
}
</script>

</body>
</html>
