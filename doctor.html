<!DOCTYPE html>
<html>
<head>
<title>Doctor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fff;
  color:white;
  padding:15px;
}

/* ================= HEADER ================= */
.header{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px 18px;
  margin-bottom:20px;

  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  backdrop-filter:blur(12px);

  box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* CENTER TITLE */
.header h2{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  font-size:22px;
  color:#38bdf8;
  white-space:nowrap;
}

/* LIVE BADGE */
.live-indicator{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:13px;
  color:#94a3b8;

  padding:6px 10px;
  border-radius:20px;
  background:rgba(56,189,248,0.08);
  border:1px solid rgba(56,189,248,0.2);
}

.live{
  width:10px;
  height:10px;
  background:#22c55e;
  border-radius:50%;
  animation:pulse 1.2s infinite;
}

.right-space{
  width:80px;
}

@keyframes pulse{
  0%{transform:scale(1); opacity:1;}
  50%{transform:scale(1.6); opacity:0.5;}
  100%{transform:scale(1); opacity:1;}
}

/* MOBILE */
@media(max-width:600px){
  .header h2{ font-size:16px; }
  .right-space{ width:40px; }
}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
  margin-top:15px;
}

/* CARD */
.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card h3{
  color:#38bdf8;
  font-size:14px;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:6px;
}

.icon{
  width:30px;
  height:30px;
  border-radius:6px;
}

.value{
  font-size:18px;
  font-weight:bold;
}

/* ================= GRAPH SECTION ================= */
.graph-container{
  margin-top:20px;
  display:grid;
  gap:20px;
}

.graph-card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  height:420px;
}

.graph-card h3{
  color:#38bdf8;
  margin-bottom:10px;
  font-size:16px;
}

/* RESPONSIVE CHART */
canvas{
  width:100% !important;
  height:340px !important;
}

/* ================= MEDICATION ================= */
.med{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#0f172a;
  margin-top:8px;
  border-radius:8px;
}

.taken{
  background:#22c55e;
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">

  <div class="live-indicator">
    <span class="live"></span>
    <span>LIVE MONITORING</span>
  </div>

  <h2>🩺 Doctor Monitoring System</h2>

  <div class="right-space"></div>
</div>

<!-- ================= VITAL CARDS ================= -->
<div class="grid">

  <div class="card">
    <h3><img class="icon" src="https://cdn-icons-png.flaticon.com/512/833/833472.png">Heart Rate</h3>
    <div class="value" id="hr">-- bpm</div>
  </div>

  <div class="card">
    <h3><img class="icon" src="https://cdn-icons-png.flaticon.com/512/2966/2966480.png">SpO2</h3>
    <div class="value" id="spo2">-- %</div>
  </div>

  <div class="card">
    <h3><img class="icon" src="https://cdn-icons-png.flaticon.com/512/1684/1684375.png">Temperature</h3>
    <div class="value" id="temp">-- °C</div>
  </div>

  <div class="card">
    <h3><img class="icon" src="https://cdn-icons-png.flaticon.com/512/2936/2936886.png">Blood Pressure</h3>
    <div class="value" id="bp">-- / --</div>
  </div>

</div>

<!-- ================= GRAPHS ================= -->
<div class="graph-container">

  <div class="graph-card">
    <h3>📈 Heart Rate Trend (Last 20 readings)</h3>
    <canvas id="hrChart"></canvas>
  </div>

  <div class="graph-card">
    <h3>⚡ ECG - Real Time Cardiac Activity</h3>
    <canvas id="ecgChart"></canvas>
  </div>

</div>

<!-- ================= MEDICATION ================= -->
<div class="card" style="margin-top:20px;">
  <h3>💊 Medication</h3>
  <div id="meds">No data loaded</div>
</div>

<script>

const API_URL = "YOUR_GOOGLE_SHEET_API";

let hrChart, ecgChart;

/* INIT CHARTS */
function initCharts(){

  hrChart = new Chart(document.getElementById("hrChart"), {
    type:"line",
    data:{
      labels:[],
      datasets:[{
        label:"Heart Rate",
        data:[],
        borderColor:"#38bdf8",
        tension:0.4,
        fill:false
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  });

  ecgChart = new Chart(document.getElementById("ecgChart"), {
    type:"line",
    data:{
      labels:[],
      datasets:[{
        label:"ECG",
        data:[],
        borderColor:"#22c55e",
        tension:0.3,
        fill:false
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  });
}

initCharts();

/* LOAD DATA */
async function loadData(){

  const res = await fetch(API_URL);
  const data = await res.json();

  const patient = data[0]; // demo single patient

  if(!patient) return;

  document.getElementById("hr").innerText = patient.heartRate + " bpm";
  document.getElementById("spo2").innerText = patient.spo2 + " %";
  document.getElementById("temp").innerText = patient.temp + " °C";
  document.getElementById("bp").innerText = patient.bp;

  if(patient.trend){
    hrChart.data.labels = patient.trend.map((_,i)=>i+1);
    hrChart.data.datasets[0].data = patient.trend;
    hrChart.update();
  }

  if(patient.ecg){
    ecgChart.data.labels = patient.ecg.map((_,i)=>i+1);
    ecgChart.data.datasets[0].data = patient.ecg;
    ecgChart.update();
  }

  renderMeds(patient.meds);
}

/* MEDICATION */
function renderMeds(meds){
  let box = document.getElementById("meds");
  box.innerHTML = "";

  meds.forEach((m,i)=>{
    let div = document.createElement("div");
    div.className="med";

    div.innerHTML=`
      <span>${m.name} - ${m.time}</span>
      <button class="taken" onclick="markTaken(${i})">Taken</button>
    `;

    box.appendChild(div);
  });
}

function markTaken(i){
  alert("Medication marked as taken ✔");
}

/* AUTO UPDATE */
setInterval(loadData,2000);

loadData();

</script>

</body>
</html>
