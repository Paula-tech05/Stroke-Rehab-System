<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="ADJ.png">
<title>Clinician Portal</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  overflow:hidden;
}

/* GLOW */
.bg-glow{
  position:absolute;
  width:300px;
  height:300px;
  background:#38bdf8;
  filter:blur(120px);
  opacity:0.3;
  border-radius:50%;
  top:10%;
  left:20%;
}

/* LOGIN CARD */
.login-box{
  position:relative;
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:15px;
  padding:30px;
  backdrop-filter:blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  animation:fadeIn 1s ease-in-out;
  z-index:2;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#38bdf8;
}

/* INPUT */
.input-box{
  position:relative;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:white;
}

input::placeholder{
  color:#94a3b8;
}

/* EYE ICON */
.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#94a3b8;
  font-size:18px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#0ea5e9;
  transform:scale(1.03);
}

/* ERROR */
#error{
  color:#ff4d4d;
  text-align:center;
  margin-top:10px;
  display:none;
}

/* SUCCESS SCREEN */
.success-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:#0f172a;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.checkmark{
  font-size:80px;
  color:#22c55e;
  animation:pop 0.6s ease;
}

@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}

.success-text{
  margin-top:10px;
  font-size:20px;
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="login-box">
  <h2>Clinician Login</h2>

  <input id="patientId" placeholder="Patient ID">
  <input id="name" placeholder="Name">

  <div class="input-box">
    <input id="password" type="password" placeholder="Password">
    <span class="eye" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="login()">Login</button>

  <p id="error">❌ Incorrect login details</p>
</div>

<!-- SUCCESS SCREEN -->
<div class="success-screen" id="success">
  <div class="checkmark">✔</div>
  <div class="success-text">Login Successful...</div>
</div>

<script>

/* DOCTOR ACCOUNT */
const doctorAccount = {
  patientId: "DOC001",
  name: "Dr. Adighije Chinonso",
  password: "1234"
};

/* TOGGLE PASSWORD */
function togglePassword(){
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

/* LOGIN */
function login(){

  const pid = document.getElementById("patientId").value;
  const name = document.getElementById("name").value;
  const pass = document.getElementById("password").value;

  const error = document.getElementById("error");

  if(
    pid === doctorAccount.patientId &&
    name === doctorAccount.name &&
    pass === doctorAccount.password
  ){

    error.style.display = "none";

    // SUCCESS ANIMATION
    document.querySelector(".login-box").style.display = "none";
    document.getElementById("success").style.display = "flex";

    setTimeout(()=>{
      window.location.href = "doctor.html";
    },2000);

  } else {
    error.style.display = "block";
  }
}

</script>

</body>
</html>
