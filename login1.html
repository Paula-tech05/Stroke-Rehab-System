<!DOCTYPE html>
<html>
<head>
<title>Doctor Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1e293b;
  padding:30px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}
input, button{
  width:100%;
  padding:10px;
  margin:10px 0;
}
button{
  background:#38bdf8;
  border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Doctor Login</h2>

<input placeholder="Patient ID (for access)">
<input placeholder="Name">
<input type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
function login(){
  window.location.href="doctor-dashboard.html";
}
</script>

</body>
</html>
